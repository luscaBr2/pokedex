<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/index.css">

    <script src="utils/pokeapi.js" defer></script>
    <script src="utils/sugestoesPesquisa.js" defer></script>
    <script src="utils/pesquisarPokemon.js" defer></script>
</head>

<body>
    <header>
        <figure class="logo-pokedex">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Pok%C3%A9_Ball_icon.svg/512px-Pok%C3%A9_Ball_icon.svg.png"
                alt="Pokebola">
        </figure>

        <div class="container-pesquisa">
            <img id="botaoReset" width="50" height="50" title="Reiniciar busca"
                src="https://img.icons8.com/sf-black-filled/64/FFFFFF/recurring-appointment.png" alt="Reiniciar busca"
                onclick="resetarBusca()" />

            <input autocomplete="off" type="search" id="pesquisa" placeholder="Buscar pokémon">

            <div id="sugestoes-pesquisa" class="hidden"></div>
        </div>
    </header>
    <main>
        <div class="container-pokemon">

            <div id="erro" class="hidden">
                <img src="https://img.icons8.com/?size=100&id=8122&format=png&color=ff1616" alt="Erro">
            </div>

            <div id="loading"></div>
            <div id="mensagem-interna"></div>

            <!-- <div class="pokemon-card">

                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/4.gif"
                    id="pokemon-image">
                <h3>
                    <span id="pokemon-id"></span>
                    <span id="pokemon-name"></span>
                </h3>

            </div> -->

        </div>
    </main>
</body>

</html>
